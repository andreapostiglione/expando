matches:
  # Prefer // aliases on non-US keyboards (no Shift required for colon).
  - triggers:
      - ":hello"
      - "//hello"
    replace: "Hi there!"

  - triggers:
      - ":date"
      - "//date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d/%m/%Y"

  - triggers:
      - ":now"
      - "//now"
    replace: "{{ts}}"
    vars:
      - name: ts
        type: date
        params:
          format: "%H:%M"
